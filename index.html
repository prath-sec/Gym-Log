<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gym Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a training logbook — week counter + weekly line, sticky tab bar (Today / Progress / Plan / Settings), single column on iPhone */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#f4f6f9; --ink:#141820; --muted:#5b6474; --line:#d4d9e1;
  --accent:#c8102e; --accent-ink:#ffffff; --good:#1d7a4b; --warn:#a96300;
  --p-red:#c8102e; --p-blue:#1d4fa0; --p-yellow:#c99600; --p-green:#2e7d32; --p-gray:#6b7380;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1115; --surface:#171b21; --sunk:#12161b; --ink:#e7eaf0; --muted:#98a1b0; --line:#2a313b;
  --accent:#ff4a5c; --accent-ink:#16060a; --good:#4cc38a; --warn:#f0a43a;
  --p-red:#ff4a5c; --p-blue:#6a95ff; --p-yellow:#f2c230; --p-green:#5cbf62; --p-gray:#8b93a0; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.01em}
.num,input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-size:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:end}
.weekno{font-family:var(--display);font-weight:800;font-size:clamp(3.4rem,13vw,5.6rem);line-height:.85;letter-spacing:-.01em}
.weekno small{font-size:.38em;color:var(--muted);font-weight:700;margin-left:4px}
.toptext{min-width:0;display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
.toptext h1{font-size:1.6rem;text-transform:uppercase}
.phase{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.95rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;font-weight:600;background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--p-gray);flex:none}
.dot.on{background:var(--good)} .dot.warn{background:var(--warn)}
.quote{border-left:4px solid var(--accent);padding:10px 14px;background:var(--surface);font-size:1.15rem;font-weight:500;line-height:1.35}
.quote .label{display:block;margin-bottom:2px}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:4px;flex-wrap:wrap}
.tab{background:none;border:0;padding:10px 12px;font-family:var(--display);font-size:1.12rem;font-weight:700;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.sync{margin-left:auto;align-self:center;font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center;background:none;border:0;padding:6px 2px}

.daybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;font-weight:700;display:grid;place-items:center;flex:none}
input[type=date]{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:40px}
.dayhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.plate{width:46px;height:46px;border-radius:50%;border:7px solid var(--pc,var(--p-gray));display:grid;place-items:center;flex:none}
.plate::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc,var(--p-gray))}
.dayhead h2{font-size:2.1rem;text-transform:uppercase}
.dayhead p{margin:0;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:6px}
.bar{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meterrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.meterrow b{color:var(--ink)}

.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.complete{border-color:var(--good)}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{font-size:1.35rem;min-width:0;overflow-wrap:anywhere}
.target{font-family:var(--mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.tip{font-size:.88rem;color:var(--muted);margin:0}
.hint{font-size:.9rem;padding:6px 10px;border-radius:6px;background:var(--sunk);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hint b{color:var(--accent)}
.hint .last{color:var(--muted);font-family:var(--mono);font-size:.8rem}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow,.colhead{display:grid;grid-template-columns:40px minmax(0,1fr) 70px 44px;gap:8px;align-items:center}
.setrow .sn{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.setrow.done .sn{color:var(--good);font-weight:700}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);min-width:0}
.stepper button{width:38px;height:44px;border:0;background:transparent;font-weight:700;font-size:1.15rem;flex:none}
.stepper input{width:100%;min-width:0;border:0;background:transparent;text-align:center;height:44px;color:var(--ink)}
.reps,.field{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);text-align:center;color:var(--ink);width:100%;min-width:0}
.field.text{text-align:left;padding-inline:10px;font-family:var(--body)}
.unit{font-size:.72rem;color:var(--muted)}
.check{width:44px;height:44px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:1.2rem;font-weight:800;color:transparent}
.check[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.colhead span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.colhead span:first-child{text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:.9rem;color:var(--muted);min-height:38px}
.ghost.danger{color:var(--accent);border-color:var(--accent)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:8px;align-items:center}
.crow .nm{font-weight:600}
.crow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
textarea{width:100%;min-height:70px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
.card ul{margin:0;padding-left:20px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1}
.stat .v small{font-size:.5em;color:var(--muted);margin-left:2px}
.stat .s{font-size:.84rem;color:var(--muted)}
.card h2{font-size:1.4rem;text-transform:uppercase}
.chartbox{overflow-x:auto}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.grid13{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:4px;font-size:.72rem}
.grid13 .h{color:var(--muted);text-align:center;font-family:var(--mono)}
.grid13 .wk{color:var(--muted);font-family:var(--mono);align-self:center}
.cell{aspect-ratio:1/1;max-width:100%;border-radius:4px;background:var(--sunk);border:1px solid var(--line);padding:0}
.cell.rest{background:transparent;border-style:dashed}
.cell.part{background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}
.cell.full{background:var(--accent);border-color:var(--accent)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .cell{width:14px;height:14px;aspect-ratio:auto}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.num{text-align:right}
.up{color:var(--good);font-weight:700}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.pday{border-top:6px solid var(--pc,var(--p-gray))}
.pday h3{font-size:1.3rem;text-transform:uppercase}
.pday ol{margin:0;padding-left:18px;font-size:.92rem}
.pday li span:last-child{font-family:var(--mono);color:var(--muted);font-size:.82rem;white-space:nowrap;margin-left:8px}
.erow{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.egrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:6px;align-items:end}
.egrid label{display:flex;flex-direction:column;gap:2px;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
.egrid .field{height:40px;background:var(--surface)}
.emove{display:flex;gap:4px}
.emove button{width:36px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:8px}
.prose p,.prose ol{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;z-index:20;max-width:calc(100% - 32px)}
.setting{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
@media (max-width:520px){.top{grid-template-columns:1fr}.toptext{padding-bottom:0}.tab{padding:10px 8px;font-size:1rem}.egrid{grid-template-columns:repeat(4,minmax(0,1fr))}.emove{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="weekno" id="weekno">1</div>
    <div class="toptext">
      <h1>Gym Log</h1>
      <div class="phase" id="phase"></div>
    </div>
  </header>
  <div class="quote"><span class="label" id="quotelabel">This week</span><span id="quotetext"></span></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="today">Today</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="progress">Progress</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="plan">Plan</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="settings">Settings</button>
    <button class="sync" id="syncbtn" type="button"><span class="dot" id="syncdot"></span><span id="synctext">On this iPhone</span></button>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
"use strict";
/* ================= defaults ================= */
const CFG = window.GYM_CONFIG || {};
const BLOCK = 13;                  // weeks per training block; blocks repeat forever
const DRIVE_FILE = "gym-log-data.json";
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const KEY = "gymlog-v1", KEY_SYNC = "gymlog-sync-v1";
const DAYNAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAYCOLOR = {0:"var(--p-gray)",1:"var(--p-red)",2:"var(--p-blue)",3:"var(--p-yellow)",4:"var(--p-gray)",5:"var(--p-green)",6:"var(--p-gray)"};
const CARDIO = [
  {k:"bike",n:"Cycling",d:"Upright or recumbent bike, moderate pace",min:15},
  {k:"walk",n:"Incline walk",d:"Treadmill, 8–12% incline, 5–6 km/h, no holding rails",min:15},
  {k:"jump",n:"Jumping",d:"Jump rope or jumping jacks, 40s on / 20s off",min:5}
];
const X = (n,s,a,b,inc,tip) => ({n,s,r:[a,b],inc,tip});
function defaultProgram(){
  return {
    updated: "1970-01-01T00:00:00.000Z",
    settings: {start:"2026-10-12", startKg:80, goalKg:65, pace:0.6},
    days: {
      1:{name:"Chest",sub:"Chest + triceps",ex:[
        X("Barbell bench press",4,6,8,2.5,"Shoulder blades pinched, bar to lower chest, feet planted."),
        X("Incline dumbbell press",3,8,10,2,"Bench at 30°. Lower for 2 seconds."),
        X("Chest press machine",3,10,12,2.5,"Handles at mid-chest. Last set close to failure."),
        X("Cable fly / pec deck",3,12,15,2.5,"Soft elbows, squeeze 1 second in the middle."),
        X("Triceps rope pushdown",3,10,12,2.5,"Elbows pinned, spread the rope at the bottom."),
        X("Overhead DB triceps extension",3,10,12,2,"One dumbbell, both hands, deep stretch.")]},
      2:{name:"Back",sub:"Back + biceps",ex:[
        X("Lat pulldown",4,8,10,2.5,"Pull to upper chest, lead with elbows."),
        X("Barbell row",4,8,10,2.5,"Hinge to ~45°, flat back, bar to belly button."),
        X("Seated cable row",3,10,12,2.5,"Chest tall, pause at the stomach."),
        X("Single-arm dumbbell row",3,10,12,2,"Pull towards the hip."),
        X("Face pull",3,15,20,2.5,"Rope to forehead, thumbs back."),
        X("Dumbbell biceps curl",3,10,12,1,"No swinging, lower slowly."),
        X("Hammer curl",2,10,12,1,"Neutral grip, elbows still.")]},
      3:{name:"Legs",sub:"Full legs",ex:[
        X("Back squat",4,6,8,5,"Brace hard, hips below knees if mobility allows."),
        X("Romanian deadlift",3,8,10,5,"Hips back until hamstrings stretch, flat back."),
        X("Leg press",3,10,12,10,"Don't lock the knees; keep lower back down."),
        X("Lying / seated leg curl",3,10,12,2.5,"Lower in 3 seconds."),
        X("Leg extension",3,12,15,2.5,"Squeeze 1 second at the top."),
        X("Standing calf raise",4,12,15,5,"Full stretch, pause at the top.")]},
      4:null,
      5:{name:"Upper body",sub:"Shoulders, chest, back, arms",ex:[
        X("Overhead press",4,6,8,2.5,"Glutes tight, no back arch."),
        X("Pull-up (or assisted)",3,6,10,2.5,"Log assistance as a negative number, e.g. -20."),
        X("Incline bench press",3,8,10,2.5,"Barbell or Smith machine."),
        X("Chest-supported row",3,10,12,2,"Face-down on an incline bench, or a row machine."),
        X("Dumbbell lateral raise",4,12,15,1,"Lead with elbows, stop at shoulder height."),
        X("Rear delt fly",3,15,20,1,"Reverse pec deck or bent-over dumbbells."),
        X("Curl + pushdown superset",3,12,15,2.5,"Cable curl then rope pushdown, rest after both.")]},
      6:{name:"Lower body",sub:"Hinge, glutes, single-leg",ex:[
        X("Deadlift",3,4,6,5,"Bar over mid-foot, push the floor away."),
        X("Bulgarian split squat",3,8,10,2,"Rear foot on bench. Reps per leg."),
        X("Hip thrust",3,10,12,5,"Chin tucked, pause at the top."),
        X("Leg press (feet narrow)",3,12,15,10,"Quad focus, controlled tempo."),
        X("Seated calf raise",4,15,20,5,"Or calf press on the leg press."),
        X("Hanging knee raise",3,10,15,0,"Core finisher. 0 kg if bodyweight.")]},
      0:null
    }
  };
}
const QUOTES = [
  "The first week isn't about weight. It's about showing up five times.",
  "Nobody remembers the easy sets. Make the last rep count.",
  "Discipline is choosing what you want most over what you want now.",
  "Your log doesn't lie. Beat one number every session.",
  "Soreness fades. The numbers in this log stay.",
  "The bar doesn't care how you feel. Lift it anyway.",
  "Halfway through the block. This is where most people quit.",
  "Small plates, every week. That's how big lifts are built.",
  "Recover on purpose this week. You come back stronger.",
  "Four weeks left in the block. Treat every session like a test.",
  "Comfort is the enemy of progress. Add the rep.",
  "Don't let the last weeks of the block be the soft ones.",
  "Finish the block like you started: every set logged.",
  "New block, same rule: show up, log it, beat it.",
  "The scale moves slowly. The logbook shows you're winning anyway.",
  "You don't need motivation today. You need your gym bag.",
  "Every plate you add now was impossible in week one.",
  "Hungry is not an emergency. Skipping a session is.",
  "Train like the person who already weighs your goal weight.",
  "Consistency beats intensity. Do both this week.",
  "One more rep is always available. Take it.",
  "Results are delayed. Effort is not. Keep paying in.",
  "Look at week one in your log. Then make this week look better.",
  "Strong habits make the hard days ordinary.",
  "Nobody is coming to do this for you. Good. It's yours.",
  "Close the block properly. Every set, every finisher."
];
const wInBlock = w => ((w-1)%BLOCK)+1;
const blockOf = w => Math.ceil(w/BLOCK);
function phaseOf(w){
  w = wInBlock(w);
  if(w<=4) return {n:"Foundation",d:"Learn the movements, find working weights, never miss a session."};
  if(w<=8) return {n:"Build",d:"Add weight whenever you hit the top of the rep range on every set."};
  if(w===9) return {n:"Deload",d:"Same weights, one set fewer per exercise. Let joints recover."};
  return {n:"Push",d:"Heaviest weeks. Chase a rep or a plate on every lift."};
}

/* ================= dates ================= */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const todayIso = () => iso(new Date());
const nice = s => parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => (Math.round(n*100)/100).toString();

/* ================= state & storage ================= */
const state = { tab:"today", date:todayIso(), sessions:{}, weights:{entries:[]}, program:defaultProgram(), editDay:null, _draft:null };
const S = () => state.program.settings;
const weekOf = s => Math.floor(daysBetween(S().start,s)/7)+1;
function startMonday(){ return S().start; }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); applyData(o); }
  }catch(e){}
}
function applyData(o){
  if(o.sessions) state.sessions = o.sessions;
  if(o.weights && Array.isArray(o.weights.entries)) state.weights = o.weights;
  if(o.program && o.program.days) {
    state.program = o.program;
    state.program.settings = Object.assign(defaultProgram().settings, o.program.settings||{});
  }
}
function snapshot(){ return {app:"gym-log", version:1, sessions:state.sessions, weights:state.weights, program:state.program, savedAt:nowIso()}; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(snapshot())); }catch(e){ toast("Couldn't save on this phone. Free some storage, then try again."); } }
function changed(){ persist(); scheduleSync(); }
function liveWeights(){ return state.weights.entries.filter(e=>e.kg!=null).sort((a,b)=>a.date<b.date?-1:1); }

/* ================= program helpers ================= */

function suggest(def, last){

const sync = { fileId:null, connected:false, lastSync:null, email:null, busy:false, error:null };
function loadSync(){ try{ Object.assign(sync, JSON.parse(localStorage.getItem(KEY_SYNC)||"{}")); }catch(e){} sync.busy=false; }

const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/,"");
function signIn(){

function readRedirect(){

  history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error")){ toast("Google sign-in was cancelled."); return; }

async function gfetch(url, opts={}){

function merge(local, remote){

document.getElementById("syncbtn").addEventListener("click",()=>{
  if(!CFG.googleClientId || !sync.connected){ switchTab("settings"); return; }
  if(!getToken()) signIn(); else runSync();
});

/* ================= shell ================= */
function switchTab(t){ state.tab=t; state.editDay = t==="plan" ? state.editDay : null; document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false")); render(); window.scrollTo({top:0}); }
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
function render(){
  renderHeader();
  ({today:renderToday,progress:renderProgress,plan:renderPlan,settings:renderSettings})[state.tab]();
  setSyncUi();
}
let deferred=false;
function safeRender(){
  const a=document.activeElement;
  if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA") && document.getElementById("view").contains(a)){
    if(!deferred){ deferred=true; a.addEventListener("blur",()=>{ deferred=false; render(); },{once:true}); } return;
  }
  render();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(state.date!==todayIso() && state.tab==="today" && !document.activeElement.matches("input,textarea")) { state.date=todayIso(); render(); } if(getToken()) runSync(); } });

load(); loadSync();
const justSignedIn = readRedirect();
render();
if(justSignedIn){ toast("Google Drive connected. Syncing…"); runSync(); }
else if(sync.connected && getToken()) runSync();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
